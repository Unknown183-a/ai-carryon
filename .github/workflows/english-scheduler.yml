name: English Scheduler

on:
  schedule:
    # Every hour (UTC). scheduler.py itself decides whether this hour is a
    # top-3 peak hour and whether the daily cap is hit — this just needs to
    # run often enough to actually land on peak hours.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_generate:
        description: "Bypass the schedule gate and daily cap (test run)"
        required: false
        default: "false"
      force_comments:
        description: "Run comment replies now, ignoring the 19:00-23:59 IST window"
        required: false
        default: "false"

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Chrome (for Instagram posting)
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Optional semantic features for the Brain (how did the most similar past videos do?). Off unless the
      # repository VARIABLE BRAIN_SEMANTIC_ENABLED is "true" AND BRAIN_TEXT_MODEL_NAME / BRAIN_TEXT_MODEL_REVISION
      # (an immutable commit hash) are set. Needs BRAIN_ENABLED too. The model is cached between runs.
      - name: Cache text-encoder weights (optional)
        if: ${{ vars.BRAIN_ENABLED == 'true' && vars.BRAIN_SEMANTIC_ENABLED == 'true' }}
        uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: text-model-${{ vars.BRAIN_TEXT_MODEL_NAME }}-${{ vars.BRAIN_TEXT_MODEL_REVISION }}

      - name: Install text encoder (optional)
        if: ${{ vars.BRAIN_ENABLED == 'true' && vars.BRAIN_SEMANTIC_ENABLED == 'true' }}
        continue-on-error: true
        run: pip install -r requirements_semantic.txt

      # Optional Brain topic ranking. Off unless the repository VARIABLE BRAIN_ENABLED is "true"
      # (Settings > Secrets and variables > Actions > Variables). Starts the engine inside this job;
      # if it fails to start the pipeline just runs without the Brain.
      - name: Start Brain engine (optional)
        if: ${{ vars.BRAIN_ENABLED == 'true' }}
        continue-on-error: true
        uses: Amit-coder78/ai-carryon-brain-platform/.github/actions/ci-engine@main
        with:
          channel: english
          semantic_role: ${{ vars.BRAIN_SEMANTIC_ROLE || 'shadow' }}

      - name: Run English scheduler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_ENGLISH || secrets.GROQ_API_KEY }}
          GROQ_API_KEY_SHARED: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_ENGLISH || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SHARED: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY_ENGLISH || secrets.PEXELS_API_KEY }}
          PEXELS_API_KEY_SHARED: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          YOUTUBE_CLIENT_SECRETS_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}
          YOUTUBE_ANALYTICS_TOKEN_B64: ${{ secrets.YOUTUBE_ANALYTICS_TOKEN_B64 }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          BRAIN_SEMANTIC_ENABLED: ${{ vars.BRAIN_SEMANTIC_ENABLED || 'false' }}
          BRAIN_TEXT_MODEL_NAME: ${{ vars.BRAIN_TEXT_MODEL_NAME }}
          BRAIN_TEXT_MODEL_REVISION: ${{ vars.BRAIN_TEXT_MODEL_REVISION }}
          BRAIN_TEXT_CACHE_DIR: .cache/transformers
          FORCE_GENERATE: ${{ github.event.inputs.force_generate || 'false' }}
          COMMENT_FORCE: ${{ github.event.inputs.force_comments || 'false' }}
        run: python scheduler.py

      - name: Upload run log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-scheduler-log-${{ github.run_id }}
          path: output/scheduler_log.txt
          if-no-files-found: ignore
