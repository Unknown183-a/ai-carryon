# Initial Federated Learning pipeline-validation experiment.
# This is NOT the final experimental configuration — see docs/roadmap.md.
experiment_name: initial_fl
seed: 42

data:
  dataset: mnist
  data_dir: data/raw
  num_clients: 5
  partition: iid          # iid | non_iid
  non_iid_alpha: 0.5      # only used when partition == non_iid (Dirichlet)
  batch_size: 32
  val_split: 0.1

model:
  name: cnn
  num_classes: 10

federated:
  num_rounds: 50
  local_epochs: 10
  local_lr: 0.01
  clients_per_round: 5    # == num_clients for this initial experiment
  aggregation: fedavg

device: cpu   # cpu | cuda

output:
  artifacts_dir: artifacts/experiments/initial_fl
  save_every_n_rounds: 5
