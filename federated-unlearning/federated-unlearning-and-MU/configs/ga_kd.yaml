# Combined Gradient Ascent + Knowledge Distillation config (blueprint §11).
# Produces M_unlearn from M_old. Values are placeholders pending tuning
# (blueprint §15 "Experiment Group D — Hyperparameters").

unlearning:
  forget_client: 0
  method: gradient_ascent_kd
  gradient_ascent:
    learning_rate: 0.001
    epochs: 1
    momentum: 0.9
    max_forget_loss: 5.0
  knowledge_distillation:
    learning_rate: 0.01
    epochs: 3
    temperature: 4.0
    momentum: 0.9
    weight: 1.0

input_checkpoint: experiments/initial_fl/checkpoints/final.pt
output_dir: experiments/ga_kd
