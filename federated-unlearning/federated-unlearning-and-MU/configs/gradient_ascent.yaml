# Gradient Ascent unlearning config (blueprint §10). Produces M_GA from M_old.
# Values below are placeholders for pipeline testing, not tuned hyperparameters.

unlearning:
  forget_client: 0
  gradient_ascent:
    learning_rate: 0.001
    epochs: 1
    momentum: 0.9
    max_forget_loss: 5.0

input_checkpoint: experiments/initial_fl/checkpoints/final.pt
output_dir: experiments/gradient_ascent
