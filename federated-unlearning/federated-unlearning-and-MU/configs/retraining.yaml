# Full-retraining baseline config (blueprint §12). Trains a fresh model on
# all clients EXCEPT `unlearning.forget_client`, from scratch, using the
# SAME federated hyperparameters as configs/initial_fl.yaml for a fair
# comparison (blueprint §29 "Compare Fairly").

clients:
  num_clients: 5

federated:
  rounds: 50
  local_epochs: 10

unlearning:
  forget_client: 0

output_dir: experiments/retraining
